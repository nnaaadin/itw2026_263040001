<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Bodoni Moda', 'DM Sans', Monserrat;
            font-weight: bold;
            color: dimgray;
            text-align: center;
            background-color: ivory;
        }

        h1 {
            font-size: 48px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: rosybrown;
            text-shadow: 2px 2px 4px grey;
            font-family: 'Bodoni Moda', bold, serif;
        }

        quote {
            font-size: 22px;
            line-height: 2.2;
            word-break: 5px;
            font-family: 'DM Sans', sans-serif;

        }

        .quote p {
            margin-bottom: 25px;
        }

        span {
            color:rosybrown;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }

        .credit {
            font-size: 12px;
            letter-spacing: 2px;
            color: slategray;
            font-weight: normal;
            font-family: Monserrat, sans-serif;
        }
    </style>
</head>

<body>
    <h1> DOA</h1>

    <p class="qoute">"Even when <span>distance</span> keeps us apart, my prayers will always find their way to you. <br>
        Because loving someone means wishing them happiness, even from afar." <br>
    </p>

    <p class="credit">- K3bi, DOA (Dream Over Anything)</p>
</body>
</html>
