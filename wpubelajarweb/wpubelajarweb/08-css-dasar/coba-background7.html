<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Background</title>
    <style>
        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #333;
        }

        .frame {
            width: 400px;
            height: 400px;
            border: 10px solid white;
            margin: auto;
            background-image: url(trans2/images-removebg-preview\ \(2\).png), url(trans/images-removebg-preview.png), url(trans/images-removebg-preview\ \(4\).png);
            background-size: 400px, 500px, 200px;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-position: bottom, center, top right;
            background-color: #f0f0f0;
            border-radius: 50%;
        }

        h1 {
            color: #fff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <h1>My id Card</h1>
    <div class="frame"></div>
</body>
</html>
