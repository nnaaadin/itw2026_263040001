<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Bodoni Moda', 'DM Sans', Monserrat;
            font-weight: bold;
            color: #d9a7b0;
            text-align: center;
            background-color: #2b111d;
            background-image: url(sky/images.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;

        }

        h1 {
            font-size: 4em;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration:none;
            /* text-shadow: 2px 2px 4px #987786; */
            background-image: linear-gradient(to right, rgb(255, 255, 255), rgb(255, 248, 235));
            font-family: 'Bodoni Moda', bold, serif;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(2px 3px 4px rgba(30, 25, 35, 0.85));
        }

        .quote {
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
            font-family: 'DM Sans', sans-serif;
            color: rgb(35, 42, 65);
            background-color: rgb(255, 255, 255, 0.88);
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgb(255, 255, 255, 0.95);
            box-shadow: 0px, 5px 18px rgb(20, 30, 50, 0.2S5);

        }

        .quote p {
            margin-bottom: 25px;
            color: rgb(35, 42, 65);
        }

        span {
            color: #b97989;
            text-decoration: none;
            text-decoration-thickness: 2px;
            text-shadow: 0 0 10px #f3bbc9 / 80% ;
        }

        .credit {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(225, 225, 225);
            font-weight: normal;
            font-family: Monserrat, sans-serif;
            text-transform: uppercase;
            border-top: 1px solid rgb(255, 255, 255, 0.5);
            text-shadow: 2px 2px 5px rgb(15, 25, 70, 0.9);
            width: 30%;
            margin: 30px auto;
            padding-top: 20px
            
        }
        </style>
</head>

<body>
    <h1> DOA</h1>

    <p class="quote">"Even when <span>distance</span> keeps us apart, my prayers will always find their way to you. <br>
        Because loving someone means wishing them happiness, even from afar." <br>
    </p>

    <p class="credit">- K3bi, DOA (Dream Over Anything)</p>
</body>
</html>
